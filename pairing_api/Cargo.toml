[package]
name = "pairing_api"
version = "0.1.0"
edition = "2021"

[features]
example = ["dep:structopt", "dep:tokio", "dep:getrandom"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
anyhow = "1.0.86"
hex = "0.4.2"
lazy_static = "1.4"
paste = "1.0.15"
rand = "0.8.5"
regex = "1.7"
relay_client = { path = "../relay_client" }
relay_rpc = { path = "../relay_rpc" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
structopt = { version = "0.3", default-features = false, optional = true }
thiserror = "1.0"
url = "2.3"
wc_common = { path = "../wc_common" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.22", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    "signal",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"], optional = true }
tokio = { version = "1.22", features = ["sync", "macros"],  optional = true } 

[[example]]
name = "pairing"
required-features = ["example"]
