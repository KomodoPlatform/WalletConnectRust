[package]
name = "relay_rpc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
cacao = [
    "dep:k256",
    "dep:sha3",
    "dep:alloy"
]

[dependencies]
alloy = { version = "0.3.6", optional = true, features = ["json-rpc", "provider-http", "contract", "rpc-types-eth"] }
anyhow = "1.0.86"
bs58 = "0.4"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
data-encoding = "2.3"
derive_more = { version = "0.99", default-features = false, features = [
    "display",
    "from",
    "as_ref",
    "as_mut",
] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
jsonwebtoken = "8.1"
k256 = { version = "0.13", optional = true }
once_cell = "1.16"
paste = "1.0.15"
rand = "0.8.5"
regex = "1.7"
serde = { version = "1.0", features = ["derive", "rc"] }
serde-aux = { version = "4.1", default-features = false }
serde_json = "1.0"
sha3 = { version = "0.10", optional = true }
sha2 = { version = "0.10.6" }
strum = { version = "0.26", features = ["strum_macros", "derive"] }
thiserror = "1.0"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { version = "1.35.1", features = ["test-util", "macros"] }
alloy = { version = "0.3.6", features = ["node-bindings"] }

[build-dependencies]
serde_json = "1.0"
hex = "0.4.3"

[lints.clippy]
indexing_slicing = "deny"
